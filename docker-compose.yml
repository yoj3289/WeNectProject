version: '3.3'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: wenect-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1!DnlsprxM2@QlalfqjsgH3#"
      MYSQL_DATABASE: mydb
      TZ: Asia/Chuncheon
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d  # 초기 SQL 스크립트
    networks:
      - wenect-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wenect-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1!DnlsprxM2@QlalfqjsgH3#"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: your-jwt-secret-key-must-be-at-least-256-bits-long-for-security
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - wenect-network
    volumes:
      - ./uploads:/app/uploads  # 파일 업로드 디렉토리
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend/donation-platform
      dockerfile: Dockerfile
    container_name: wenect-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - wenect-network
    volumes:
      - ./uploads:/usr/share/nginx/html/uploads  # 업로드 파일 서빙

volumes:
  mysql_data:
    external: true

networks:
  wenect-network:
    driver: bridge
